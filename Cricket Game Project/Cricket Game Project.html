<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cricket Game</title>
    <link rel="stylesheet" href="cricket.css" />
  </head>
  <body>
    <h1>Bat Ball Stump Game</h1>
    <button
      class="choice-button"
      onclick="
        let computerChoice = generateComputerChoice();
        let resultMsg = getResult('Bat', computerChoice);
        showResult('Bat', computerChoice, resultMsg);
      "
    >
      <img src="Images/bat.png" alt="Bat Image" class="choice-image" />
    </button>
    <button
      class="choice-button"
      onclick="
        computerChoice = generateComputerChoice();
        resultMsg = getResult('Ball', computerChoice);
        showResult('Ball', computerChoice, resultMsg);
      "
    >
      <img src="Images/ball.png" alt="Ball Image" class="choice-image" />
    </button>
    <button
      class="choice-button"
      onclick="
        computerChoice = generateComputerChoice();
        resultMsg = getResult('stump', computerChoice);
        showResult('stump', computerChoice, resultMsg);
      "
    >
      <img src="Images/stump.png" alt="Stump Image" class="choice-image" />
    </button>
    <h3 id="user-choice"></h3>
    <h3 id="computer-choice"></h3>
    <h3 id="result"></h3>
    <h3 id="score"></h3>
    <button
      onclick="
        localStorage.clear();
        resetScore();
      "
    >
      Reset
    </button>
    <script>
      let scoreStr = localStorage.getItem("Score");
      let score;
      resetScore(scoreStr);

      function resetScore(scoreStr) {
        score = scoreStr
          ? JSON.parse(scoreStr)
          : {
              win: 0,
              lost: 0,
              tie: 0,
            };

        score.displayScore = function () {
          return `Score: Won: ${score.win}, Lost: ${score.lost}, Tie: ${score.tie}`;
        };
        showResult();
      }

      function generateComputerChoice() {
        let randomNumber = Math.random() * 3;
        if (randomNumber > 0 && randomNumber <= 1) {
          return "Bat";
        } else if (randomNumber > 1 && randomNumber <= 2) {
          return "Ball";
        } else {
          return "stump";
        }
      }

      function getResult(userChoice, computerChoice) {
        if (userChoice === "Bat") {
          if (computerChoice === "Ball") {
            score.win++;
            return "User Won!";
          } else if (computerChoice === "Bat") {
            score.tie++;
            return `It's a tie!`;
          } else if (computerChoice === "stump") {
            score.lost++;
            return "Computer Won!";
          }
        } else if (userChoice === "Ball") {
          if (computerChoice === "Bat") {
            score.lost++;
            return "Computer Won!";
          } else if (computerChoice === "Ball") {
            score.tie++;
            return `It's a tie!`;
          } else if (computerChoice === "stump") {
            score.win++;
            return "User Won!";
          }
        } else if (userChoice === "stump") {
          if (computerChoice === "Bat") {
            score.win++;
            return "User Won!";
          } else if (computerChoice === "Ball") {
            score.lost++;
            return "Computer Won!";
          } else if (computerChoice === "stump") {
            score.tie++;
            return `It's a tie!`;
          }
        }
      }

      function showResult(userChoice, computerChoice, result) {
        localStorage.setItem("Score", JSON.stringify(score));
        document.querySelector("#user-choice").innerText = userChoice
          ? `You have chosen ${userChoice}`
          : "";
        document.querySelector("#computer-choice").innerText = computerChoice
          ? `Computer choice is ${computerChoice}`
          : "";
        document.querySelector("#result").innerText = result || "";
        document.querySelector("#score").innerText = score.displayScore();
      }
    </script>
  </body>
</html>
